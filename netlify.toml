[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# SPA fallback (API routes are handled by Netlify Functions via config.path)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
